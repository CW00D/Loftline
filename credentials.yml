# Credential descriptors.
#
# Everything about each credential except its secret. Values live in the vault,
# which is a separate private repository (ADR-011). A descriptor carrying a
# value fails schema validation, so this file cannot quietly become a secret
# store.
#
# Do not enumerate credentials from memory. Add each descriptor the first time
# `loftline plan` reports it missing. See the population strategy in
# credentials.md.

render_api_key:
  vendor: render
  scope: account
  state: held
  consumed_by: [ci]
  environments: [staging, production]
  github_secret: RENDER_API_KEY
  vault_path: loftline/render/api_key
  expires: null
  acquire: |
    1. dashboard.render.com, sign in
    2. Account Settings, then API Keys
    3. Create API Key, label it Loftline
    4. Copy immediately; the value is shown once and never again

expo_push_token:
  vendor: expo
  scope: account
  state: held
  consumed_by: [backend]
  environments: [staging, production]
  github_secret: EXPO_PUSH_TOKEN
  vault_path: loftline/expo/push_token
  expires: null
  acquire: |
    1. expo.dev, sign in
    2. Account Settings, then Access Tokens
    3. Create token, label it Loftline
    4. Copy immediately; the value is shown once and never again

aura_client_id:
  vendor: aura
  scope: account
  state: manual
  consumed_by: [ci]
  environments: [staging, production]
  github_secret: AURA_CLIENT_ID
  vault_path: loftline/aura/client_id
  expires: null
  acquire: |
    1. console.neo4j.io, sign in
    2. Account details, then API keys
    3. Create, label it Loftline
    4. The client id and the client secret are shown together, once. Store
       both now: aura_client_secret is the other half of this pair.

# Produced credentials. These cannot pre-exist, so they carry no vault path and
# are written straight to environment secrets during provisioning.

database_url:
  vendor: render
  scope: project
  state: produced
  produced_by: render_postgres_create
  consumed_by: [backend]
  environments: [staging, production]
  github_secret: DATABASE_URL
  expires: null

render_service_id:
  vendor: render
  scope: project
  state: produced
  produced_by: render_service_create
  consumed_by: [ci]
  environments: [staging, production]
  github_secret: RENDER_SERVICE_ID
  expires: null
