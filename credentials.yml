# Credential descriptors.
#
# Everything about each credential except its secret. Values live in the vault,
# which is a separate private repository (ADR-011). A descriptor carrying a
# value fails schema validation, so this file cannot quietly become a secret
# store.
#
# Do not enumerate credentials from memory. Add each descriptor the first time
# `loftline plan` reports it missing. See the population strategy in
# credentials.md.

render_api_key:
  vendor: render
  scope: account
  state: held
  consumed_by: [ci]
  environments: [staging, production]
  github_secret: RENDER_API_KEY
  vault_path: loftline/render/api_key
  expires: null
  acquire: |
    1. dashboard.render.com, sign in
    2. Account Settings, then API Keys
    3. Create API Key, label it Loftline
    4. Copy immediately; the value is shown once and never again

expo_push_token:
  vendor: expo
  scope: account
  state: held
  consumed_by: [backend]
  environments: [staging, production]
  github_secret: EXPO_PUSH_TOKEN
  vault_path: loftline/expo/push_token
  expires: null
  acquire: |
    1. expo.dev, sign in
    2. Account Settings, then Access Tokens
    3. Create token, label it Loftline
    4. Copy immediately; the value is shown once and never again

aura_client_id:
  vendor: aura
  scope: account
  state: manual
  consumed_by: [ci]
  environments: [staging, production]
  github_secret: AURA_CLIENT_ID
  vault_path: loftline/aura/client_id
  expires: null
  acquire: |
    1. console.neo4j.io, sign in
    2. Account details, then API keys
    3. Create, label it Loftline
    4. The client id and the client secret are shown together, once. Store
       both now: aura_client_secret is the other half of this pair.

aura_client_secret:
  vendor: aura
  scope: account
  state: manual
  consumed_by: [ci]
  environments: [staging, production]
  github_secret: AURA_CLIENT_SECRET
  vault_path: loftline/aura/client_secret
  expires: null
  acquire: |
    Issued together with aura_client_id; see that entry. The pair is shown
    once. If only this half is lost, create a new API key and store both.

# --- Mobile: Expo and Apple ---------------------------------------------------
# All global. An EAS build in CI authenticates with an Expo access token;
# signing and store submission use the Apple credentials, configured once
# through EAS. Apple app-specific passwords do not expire; revoke by hand.

expo_access_token:
  vendor: expo
  scope: account
  state: manual
  consumed_by: [ci]
  environments: [staging, production]
  github_secret: EXPO_TOKEN
  vault_path: loftline/expo/access_token
  expires: null
  acquire: |
    1. expo.dev, sign in
    2. Account Settings, then Access Tokens
    3. Create token, label it Loftline CI
    4. Copy immediately; the value is shown once and never again

apple_team_id:
  vendor: apple
  scope: account
  state: held
  consumed_by: [ci]
  environments: [staging, production]
  github_secret: APPLE_TEAM_ID
  vault_path: loftline/apple/team_id
  expires: null
  acquire: |
    developer.apple.com, Account, then Membership details. The Team ID is a
    ten-character code. It is not secret, but it is needed everywhere.

app_store_connect_key:
  vendor: apple
  scope: account
  state: manual
  consumed_by: [ci]
  environments: [staging, production]
  github_secret: APP_STORE_CONNECT_KEY
  vault_path: loftline/apple/app_store_connect_key
  expires: null
  acquire: |
    1. appstoreconnect.apple.com, Users and Access, then Integrations
    2. App Store Connect API, Team Keys, generate a key with the App Manager role
    3. Download the .p8 immediately; it can be downloaded once only
    4. Store the file contents. Note the Key ID and Issuer ID shown beside it;
       EAS asks for all three.

apple_app_specific_password:
  vendor: apple
  scope: account
  state: manual
  consumed_by: [ci]
  environments: [staging, production]
  github_secret: APPLE_APP_PASSWORD
  vault_path: loftline/apple/app_specific_password
  expires: null
  acquire: |
    1. appleid.apple.com, sign in
    2. Sign-In and Security, then App-Specific Passwords
    3. Generate, label it Loftline
    4. Copy immediately; the value is shown once and never again

google_play_service_account:
  vendor: google
  scope: account
  state: manual
  consumed_by: [ci]
  environments: [staging, production]
  github_secret: GOOGLE_PLAY_SERVICE_ACCOUNT_KEY
  vault_path: loftline/google/play_service_account_key
  expires: null
  acquire: |
    1. play.google.com/console, Users and permissions, then Invite new users;
       or console.cloud.google.com, IAM, Service accounts: create one named
       Loftline submit in the Play Console's linked Cloud project
    2. Keys, Add key, JSON; download it once
    3. Back in the Play Console, grant that service account Release manager
       on every app it will submit
    4. Store the whole JSON file's contents as the value

# --- GitHub sign-in ------------------------------------------------------------
# An OAuth App per product, registered by hand in GitHub's developer settings
# with the API's /auth/github/callback as its redirect. The client id is not
# secret and lives in the product's configuration; the secret is per product
# and so lives at a per-product vault path.

github_oauth_client_secret:
  vendor: github
  scope: project
  state: manual
  consumed_by: [backend]
  environments: [staging, production]
  github_secret: GITHUB_OAUTH_CLIENT_SECRET
  vault_path: loftline-site/github/oauth_client_secret
  expires: null
  acquire: |
    1. github.com, Settings, Developer settings, OAuth Apps, the product's app
    2. Generate a new client secret; it is shown once
    3. Store it. The Client ID beside it is configuration, not a secret.

# --- The Loftline dashboard ---------------------------------------------------
# A personal token for the command line, created on the dashboard's Settings
# page and shown once. `loftline sync` carries it to push a project's spec and
# status and pull the collaborators the team asked for.

loftline_site_token:
  vendor: loftline
  scope: account
  state: manual
  consumed_by: [cli]
  environments: [staging, production]
  github_secret: LOFTLINE_SITE_TOKEN
  vault_path: loftline/site/token
  expires: null
  acquire: |
    1. Sign in to the Loftline dashboard, then Settings
    2. Command line, New token name, Create token
    3. Copy it; it is shown once. `loftline login` stores it for you.

# --- Stripe, for the payments family -------------------------------------------
# One Stripe account per operator. The secret key is global and held; the
# publishable key is global and not secret but is still custody; the webhook
# signing secret exists only once the endpoint is registered, at provisioning.

stripe_secret_key:
  vendor: stripe
  scope: account
  state: manual
  consumed_by: [backend]
  environments: [staging, production]
  github_secret: STRIPE_SECRET_KEY
  vault_path: loftline/stripe/secret_key
  expires: null
  acquire: |
    1. dashboard.stripe.com; the API keys panel is on the home page, or
       Developers (bottom left), then API keys
    2. Stay in the sandbox (test mode) until the product is live; the live
       key is a separate value under the live account
    3. Reveal the Secret key (sk_test_...) and copy it

stripe_publishable_key:
  vendor: stripe
  scope: account
  state: held
  consumed_by: [web, mobile]
  environments: [staging, production]
  github_secret: STRIPE_PUBLISHABLE_KEY
  vault_path: loftline/stripe/publishable_key
  expires: null
  acquire: |
    dashboard.stripe.com; the API keys panel is on the home page. The
    Publishable key (pk_test_...) is beside the Secret key and is safe to
    embed in a client.

# Produced credentials. These cannot pre-exist, so they carry no vault path and
# are written straight to environment secrets during provisioning.

database_url:
  vendor: render
  scope: project
  state: produced
  produced_by: render_postgres_create
  consumed_by: [backend]
  environments: [staging, production]
  github_secret: DATABASE_URL
  expires: null

render_service_id:
  vendor: render
  scope: project
  state: produced
  produced_by: render_service_create
  consumed_by: [ci]
  environments: [staging, production]
  github_secret: RENDER_SERVICE_ID
  expires: null

# --- Cloudflare R2 object storage --------------------------------------------
# The account id and an API token able to create buckets and access keys are
# global. Everything a project actually uses at runtime is minted per project
# from that token, scoped to that project's bucket, so a leaked runtime key
# exposes one bucket rather than all of them.

cloudflare_account_id:
  vendor: cloudflare
  scope: account
  state: held
  consumed_by: [backend]
  environments: [staging, production]
  github_secret: R2_ACCOUNT_ID
  vault_path: loftline/cloudflare/account_id
  expires: null
  acquire: |
    1. dash.cloudflare.com, sign in
    2. Account Home, then the account: the Account ID is in the right-hand
       column of the overview and in the URL of every page under it

cloudflare_api_token:
  vendor: cloudflare
  scope: account
  state: manual
  consumed_by: [ci]
  environments: [staging, production]
  github_secret: CLOUDFLARE_API_TOKEN
  vault_path: loftline/cloudflare/api_token
  expires: null
  acquire: |
    1. dash.cloudflare.com, profile menu, then API Tokens
    2. Create Token, then Create Custom Token, name it Loftline provisioning
    3. Permissions: Zone, DNS, Edit (for every zone Loftline may point at
       a project) and, if object storage is used, Account, Workers R2
       Storage, Edit. This token creates DNS records, buckets and
       per-project access keys; it is never used by a running application.
    4. Copy immediately; the value is shown once and never again

r2_bucket:
  vendor: cloudflare
  scope: project
  state: produced
  produced_by: r2_bucket_create
  consumed_by: [backend]
  environments: [staging, production]
  github_secret: R2_BUCKET
  expires: null

r2_access_key_id:
  vendor: cloudflare
  scope: project
  state: produced
  produced_by: r2_access_key_create
  consumed_by: [backend]
  environments: [staging, production]
  github_secret: R2_ACCESS_KEY_ID
  expires: null

r2_secret_access_key:
  vendor: cloudflare
  scope: project
  state: produced
  produced_by: r2_access_key_create
  consumed_by: [backend]
  environments: [staging, production]
  github_secret: R2_SECRET_ACCESS_KEY
  expires: null

# --- Email, sent through Gmail -----------------------------------------------
# Global: one development sender address shared by every project. The
# password is a Gmail app password, which requires 2-Step Verification on the
# account and is revoked automatically if the account password changes.

smtp_user:
  vendor: google
  scope: account
  state: held
  consumed_by: [backend]
  environments: [staging, production]
  github_secret: SMTP_USER
  vault_path: loftline/google/smtp_user
  expires: null
  acquire: |
    The full Gmail address used as the sender, e.g. name@gmail.com

smtp_password:
  vendor: google
  scope: account
  state: manual
  consumed_by: [backend]
  environments: [staging, production]
  github_secret: SMTP_PASSWORD
  vault_path: loftline/google/smtp_app_password
  expires: null
  acquire: |
    1. myaccount.google.com, then Security
    2. Confirm 2-Step Verification is on; app passwords are unavailable without it
    3. Search the settings for App passwords, create one, name it Loftline
    4. Copy the 16-character password immediately, without the spaces; it is
       shown once and never again

# --- Neo4j Aura instance -----------------------------------------------------
# Produced per project when the instance is created, using the global Aura API
# credentials. The username is always the literal string neo4j and is template
# configuration, not a credential.

neo4j_uri:
  vendor: aura
  scope: project
  state: produced
  produced_by: aura_instance_create
  consumed_by: [backend]
  environments: [staging, production]
  github_secret: NEO4J_URI
  expires: null

neo4j_password:
  vendor: aura
  scope: project
  state: produced
  produced_by: aura_instance_create
  consumed_by: [backend]
  environments: [staging, production]
  github_secret: NEO4J_PASSWORD
  expires: null

# One webhook endpoint per payment module, each with its own signing secret,
# so a module can be added, rotated or removed without touching the others.
stripe_checkout_webhook_secret:
  vendor: stripe
  scope: project
  state: produced
  produced_by: stripe_webhook_create
  consumed_by: [backend]
  environments: [staging, production]
  github_secret: STRIPE_CHECKOUT_WEBHOOK_SECRET
  expires: null

stripe_subscriptions_webhook_secret:
  vendor: stripe
  scope: project
  state: produced
  produced_by: stripe_webhook_create
  consumed_by: [backend]
  environments: [staging, production]
  github_secret: STRIPE_SUBSCRIPTIONS_WEBHOOK_SECRET
  expires: null

# --- Per-project secrets generated locally -----------------------------------
# Never stored in the vault and never shared between projects. A signing key
# reused across applications lets a token issued by one be accepted by another.

jwt_secret:
  vendor: loftline
  scope: project
  state: derivable
  # A name from the DERIVATIONS registry in cli/loftline/secrets.py: 32 random
  # bytes, base64url encoded. Generated once per environment and kept.
  derivation: random_bytes_32_base64
  consumed_by: [backend]
  environments: [staging, production]
  github_secret: JWT_SECRET
  expires: null
