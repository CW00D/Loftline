# The one CI workflow. Lints and tests the API against a real Neo4j on every
# push to a long-lived branch and on every pull request.
#
# This file is copied into generated projects byte for byte, never rendered:
# ${{ }} is GitHub's syntax and must not meet a template engine. Per-project
# variation belongs in repository variables, not in this file.
name: CI

on:
  push:
    branches: [dev, staging, prod]
  pull_request:
  # Re-run by hand from the Actions tab.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api

    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/skeleton
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p skeleton 'RETURN 1' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24

    env:
      NEO4J_URI: neo4j://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: skeleton
      JWT_SECRET: ci-only-not-a-secret-ci-only-not-a-secret-xx

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Build the image
        # The Dockerfile is what the host deploys. A green test run against a
        # broken build is not green.
        run: docker build -t skeleton-api .
