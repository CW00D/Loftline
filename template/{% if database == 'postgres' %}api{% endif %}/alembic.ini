# Alembic configuration. Run from this directory:
#
#   alembic revision --autogenerate -m "what changed"   # after editing tables.py
#   alembic upgrade head                                 # what db.migrate() does at boot
#   alembic downgrade -1
#
# The database URL is not here: migrations/env.py reads DATABASE_URL, the same
# way the API does, so a migration can never target a different database from
# the one the code is talking to.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
