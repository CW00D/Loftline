[project]
name = "loftline"
version = "0.1.0"
description = "A scaffolder and provisioner: credential custody first, templating second."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
loftline = "loftline.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli/loftline"]

[tool.pytest.ini_options]
pythonpath = ["cli"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["cli", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.12"
mypy_path = "cli"
strict = true
