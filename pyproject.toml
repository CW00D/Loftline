[project]
name = "loftline"
version = "0.3.0"
description = "A scaffolder and provisioner: credential custody first, templating second."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "copier>=9.18.2",
    "mcp>=2.2.0",
]

[project.scripts]
loftline = "loftline.cli:app"
loftline-mcp = "loftline.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-pyyaml>=6.0",
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli/loftline"]

# The template is the product. It ships inside the wheel beside the code,
# so an installed tool has everything a checkout has (cli/loftline/paths.py).
[tool.hatch.build.targets.wheel.force-include]
"copier.yml" = "loftline/_bundle/copier.yml"
"credentials.yml" = "loftline/_bundle/credentials.yml"
"template" = "loftline/_bundle/template"
"infra" = "loftline/_bundle/infra"

[tool.hatch.build.targets.sdist]
include = ["cli", "template", "infra", "copier.yml", "credentials.yml", "README.md", "LICENSE", "docs"]

[tool.pytest.ini_options]
pythonpath = ["cli"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["cli", "tests"]
# template/ is generated-project code with its own tooling in template/api.
extend-exclude = ["template"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.12"
mypy_path = "cli"
strict = true
exclude = ["^template/"]
