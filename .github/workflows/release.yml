# Builds one executable per platform for a tagged release and attaches them,
# so the dashboard's Download buttons always point at the latest.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The executable carries the template inside it (packaging/loftline.spec).
# It still needs the tools Loftline drives on the machine: sops, age, gh,
# terraform, docker; the install page lists them.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: loftline-windows-x64.exe
            built: dist/exe/loftline.exe
          - os: macos-latest
            asset: loftline-macos-arm64
            built: dist/exe/loftline
          - os: ubuntu-latest
            asset: loftline-linux-x64
            built: dist/exe/loftline
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install
        run: uv sync --dev

      - name: Build the executable
        run: uv run pyinstaller packaging/loftline.spec --noconfirm --distpath dist/exe --workpath build/pyi

      - name: Check it runs
        run: ${{ matrix.built }} --help

      - name: Name the asset
        shell: bash
        run: cp "${{ matrix.built }}" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  release:
    needs: [build, wheel]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "Loftline ${GITHUB_REF_NAME}" --generate-notes assets/* \
          || gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber assets/*
